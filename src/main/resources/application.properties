spring.application.name=Noyon

# ??? Database ???????????????????????????????????????????????????????????????
spring.datasource.url=${SPRING_DATASOURCE_URL:jdbc:postgresql://localhost:5432/noyon_db}
spring.datasource.username=${SPRING_DATASOURCE_USERNAME:postgres}
spring.datasource.password=${SPRING_DATASOURCE_PASSWORD:postgres}
spring.datasource.driver-class-name=${SPRING_DATASOURCE_DRIVER_CLASS_NAME:org.postgresql.Driver}
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.PostgreSQLDialect

# ??? JPA ?????????????????????????????????????????????????????????????????????
# WARNING: change to 'validate' or 'none' in production
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=false
spring.jpa.properties.hibernate.format_sql=true
spring.jpa.open-in-view=false

# ??? JWT ?????????????????????????????????????????????????????????????????????
# Generate a strong random secret: `openssl rand -base64 64`
# In production, set this via environment variable
noyon.jwt.secret=${JWT_SECRET:your-very-strong-secret-key-at-least-512-bits-long-change-this-now}
noyon.jwt.access-token-expiration-ms=900000
noyon.jwt.refresh-token-expiration-ms=604800000

# ??? Server ??????????????????????????????????????????????????????????????????
server.port=8080